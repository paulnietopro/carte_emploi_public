name: Mise à jour des offres (toutes les 12h)

on:
  schedule:
    # Toutes les 12h (00:00 et 12:00 UTC). GitHub peut retarder légèrement
    # l'exécution en période de forte charge, c'est normal.
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}   # permet de déclencher le run manuellement depuis l'onglet Actions
  push:
    paths:
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Récupérer et géocoder les offres
        run: python scripts/update_data.py

      - name: Commit et push si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offres.json data/last_update.json data/geocode_cache.json
          if git diff --cached --quiet; then
            echo "Aucun changement de données à publier."
          else
            git commit -m "Mise à jour automatique des offres ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
